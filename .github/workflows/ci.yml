name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff || true

      - name: Check protected paths
        if: github.event_name == 'pull_request'
        run: |
          python ops/scripts/check_protected_paths.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.sha }} || python ops/scripts/check_protected_paths.py --base origin/${{ github.base_ref }} --head HEAD

      - name: Byte-compile verification
        run: python -m compileall -q backend ops

      - name: Lint with ruff (if available)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check backend ops || true
          else
            echo "ruff non disponible, étape de linting ignorée."
          fi

      - name: Run unit tests
        env:
          CI: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: pytest -q backend/tests/unit
