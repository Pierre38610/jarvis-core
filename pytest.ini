[pytest]
cache_dir = .cache/pytest
asyncio_mode = auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:tmpdir --capture=sys
norecursedirs = _test_scratch scratch_healing venv .git .agents .cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
