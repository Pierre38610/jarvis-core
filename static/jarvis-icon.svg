<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fond sombre Stark -->
  <rect width="512" height="512" rx="100" fill="#0B0F19" />

  <!-- Halo d'énergie -->
  <circle cx="256" cy="256" r="210" fill="url(#reactorGlow)" />

  <!-- Anneau extérieur néon -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00E5FF" stroke-width="6" opacity="0.8" filter="url(#neonBlur)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="16 10" opacity="0.7" />

  <!-- Segments du réacteur Arc (10 segments) -->
  <g transform="translate(256, 256)">
    <!-- 10 bobines d'induction de l'Arc Reactor -->
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(0)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(36)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(72)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(108)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(144)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(180)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(216)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(252)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(288)" />
    <rect x="-14" y="-160" width="28" height="42" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="2" transform="rotate(324)" />
  </g>

  <!-- Anneau intermédiaire -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00E5FF" stroke-width="5" filter="url(#neonBlur)" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.9" />

  <!-- Cœur central du réacteur -->
  <circle cx="256" cy="256" r="75" fill="url(#coreGlow)" filter="url(#neonBlur)" />
  <circle cx="256" cy="256" r="50" fill="#FFFFFF" opacity="0.9" />

  <!-- Triangle stylisé Stark au centre -->
  <polygon points="256,220 286,275 226,275" fill="none" stroke="#0284C7" stroke-width="4" opacity="0.8" />
</svg>
